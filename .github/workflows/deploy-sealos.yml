name: Deploy Hermes to Sealos

on:
  push:
    branches: [sealos-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealos-production
  cancel-in-progress: false

env:
  IMAGE: harbor.bja.sealos.run/ns-rdl1tl4m/hermes-agent
  NAMESPACE: ns-rdl1tl4m
  APP: hermes-agent-m6n6

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@v3
        with:
          registry: harbor.bja.sealos.run
          username: ${{ secrets.SEALOS_REGISTRY_USERNAME }}
          password: ${{ secrets.SEALOS_REGISTRY_PASSWORD }}
      - name: Build and publish the deployed release
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=sealos-amd64
          cache-to: type=gha,mode=max,scope=sealos-amd64
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - name: Deploy and check rollout
        env:
          SEALOS_KUBECONFIG: ${{ secrets.SEALOS_KUBECONFIG }}
          APP_URL: ${{ vars.SEALOS_APP_URL }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/sealos-kubeconfig"
          umask 077
          printf '%s' "$SEALOS_KUBECONFIG" > "$KUBECONFIG"
          trap 'rm -f "$KUBECONFIG"' EXIT
          kubectl -n "$NAMESPACE" set image "statefulset/$APP" "$APP=$IMAGE:$GITHUB_SHA"
          kubectl -n "$NAMESPACE" rollout status "statefulset/$APP" --timeout=900s
          test -n "$APP_URL"
          status=$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --output /dev/null --write-out '%{http_code}' "$APP_URL/")
          test "$status" = 401
          echo 'Rollout ready; authenticated public boundary returns HTTP 401 as expected.'
